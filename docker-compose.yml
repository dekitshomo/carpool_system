version: '3.8'

services:
  carpool-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-carpool-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=carpool_secret_jwt_key_2026_academic_prod
    volumes:
      - carpool-db-data:/app/backend/data

volumes:
  carpool-db-data:
    driver: local

